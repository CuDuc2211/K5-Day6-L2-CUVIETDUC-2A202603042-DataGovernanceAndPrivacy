# ============================================================
# Group config — EDIT ME (one per group). Values here override
# the track defaults loaded from `track_config`.
# ============================================================
group_id: SOLO                    # Bài làm cá nhân; thay bằng mã lớp nếu được yêu cầu
owner: "Cù Việt Đức (2A202603042)" # chủ dự án cá nhân; Git author hiện tại là CuDuc2211
track_config: tracks/t02.yaml     # pick your challenge: tracks/t01.yaml ... tracks/t14.yaml
track: t02                        # must match track_config
input: fixtures/t02_raw_qc        # or data/real/... if your instructor provided a real pack
output: out/
seed: 42
offline: true                     # demo/eval must not touch the network
strict_provenance: true           # fail if manifest.csv hashes do not match

# Track params (merged over track_config.params). Chỉ chỉnh trên dev trước eval.
params:
  budget: 20
  dark_limit_day: 0.30
  dark_limit_dusk: 0.55
  dark_limit_night: 0.82
  glare_start: 0.006
  glare_span: 0.025
  block_start: 1.50
  block_span: 1.70
  action_threshold: 0.45
